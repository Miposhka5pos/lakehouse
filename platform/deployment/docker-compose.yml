name: lakehouse

services:

  postgres:
    image: postgres:17-alpine
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD}
      ICEBERG_DB_NAME: ${ICEBERG_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/iceberg-catalog-postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - iceberg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rest:
    image: lakehouse-iceberg-rest:local
    build:
      context: ../services/iceberg-rest
      dockerfile: Dockerfile
    container_name: lakehouse-iceberg-rest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOG_CATALOG_NAME: demo
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${ICEBERG_DB_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_DB_PASSWORD}
      CATALOG_JDBC_STRICT__MODE: "true"

      CATALOG_WAREHOUSE: hdfs://namenode:9000/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.hadoop.HadoopFileIO

      HADOOP_CONF_DIR: /opt/hadoop-conf
    volumes:
      - ../services/hadoop/conf/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ../services/hadoop/conf/hdfs-site.xml:/opt/hadoop-conf/hdfs-site.xml:ro
    ports:
      - "8181:8181"
    networks:
      - iceberg_net
    restart: unless-stopped

  spark:
    image: lakehouse-spark:3.5.10
    build:
      context: ../services/spark
      dockerfile: Dockerfile
    container_name: lakehouse-spark
    depends_on:
      - rest
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/spark/conf
    ports:
      - "8888:8888"
      - "8080:8080"
      - "10000:10000"
      - "10001:10001"
    volumes:
      - ../services/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../services/spark/requirements.txt:/opt/spark/requirements.txt:ro
      - ../services/hadoop/conf/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ../services/hadoop/conf/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ../services/hadoop/conf/yarn-site.xml:/opt/spark/conf/yarn-site.xml:ro
    command:
      - /bin/bash
      - -lc
      - pip install --no-cache-dir -r /opt/spark/requirements.txt && notebook
    networks:
      iceberg_net:
        aliases:
          - spark-iceberg
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: lakehouse_postgres_data

networks:
  iceberg_net:
    name: lakehouse_iceberg_net
    driver: bridge

include:
  - path: ./airflow-compose.yml