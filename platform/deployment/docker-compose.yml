name: lakehouse

services:

  postgres:
    image: postgres:17-alpine
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD}
      ICEBERG_DB_NAME: ${ICEBERG_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/iceberg-catalog-postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - iceberg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: lakehouse-minio:2025-10-15
    build:
      context: ./minio/source
      dockerfile: ../Dockerfile
      args:
        MINIO_COMMIT: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
        MINIO_COMMIT_TIME: "2026-02-12T20:18:48Z"
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  rest:
    image: lakehouse-iceberg-rest:local
    build:
      context: ./rest
      dockerfile: Dockerfile
    container_name: lakehouse-iceberg-rest
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1

      CATALOG_CATALOG_NAME: demo
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${ICEBERG_DB_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_DB_PASSWORD}
      CATALOG_JDBC_STRICT__MODE: "true"
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    networks:
      - iceberg_net
    restart: unless-stopped

  spark:
    image: tabulario/spark-iceberg@sha256:790a72e744e0d09f161e1b4c7c2f79625cc598cf0476da4703e62f1f4e023460
    container_name: lakehouse-spark
    depends_on:
      - rest
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "8888:8888"
      - "8080:8080"
      - "10000:10000"
      - "10001:10001"
    volumes:
      - ../services/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../../applications/spark/retail/online_retail_ii:/opt/spark/jobs:ro
      - ../services/spark/requirements.txt:/opt/spark/requirements.txt:ro
    command:
      - "pip install --no-cache-dir -r /opt/spark/requirements.txt && notebook"
    networks:
      iceberg_net:
        aliases:
          - spark-iceberg
    restart: unless-stopped

volumes:
  minio_data:
    external: true
    name: lakehouse_minio_data
  postgres_data:
    external: true
    name: lakehouse_postgres_data

networks:
  iceberg_net:
    name: lakehouse_iceberg_net
    driver: bridge

include:
  - path: ./airflow-compose.yml