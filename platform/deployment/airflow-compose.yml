x-airflow-common: &airflow-common
  image: apache/airflow:3.1.8
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_AUTH_USERNAME}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
  volumes:
    - ../services/airflow/dags:/opt/airflow/dags
    - ../services/airflow/logs:/opt/airflow/logs
    - ../services/airflow/config:/opt/airflow/config
  networks:
    - airflow_net
    - iceberg_net
  restart: unless-stopped

services:
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_net
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      AIRFLOW_AUTH_USERNAME: ${AIRFLOW_AUTH_USERNAME:?AIRFLOW_AUTH_USERNAME is required}
      AIRFLOW_AUTH_PASSWORD: ${AIRFLOW_AUTH_PASSWORD:?AIRFLOW_AUTH_PASSWORD is required}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        python /opt/airflow/config/init_simple_auth.py
        airflow db migrate
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_postgres_data:
    external: true
    name: lakehouse_airflow_postgres_data

networks:
  airflow_net:
  iceberg_net:
    external: true
    name: lakehouse_iceberg_net