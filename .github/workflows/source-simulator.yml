name: Source Simulator

on:
  push:
    paths:
      - "source-simulator/**"
      - ".github/workflows/source-simulator.yml"
  pull_request:
    paths:
      - "source-simulator/**"
      - ".github/workflows/source-simulator.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: source_db
          POSTGRES_USER: source_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U source_user -d source_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: source_db
      PGUSER: source_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r source-simulator/simulator/requirements.txt
      - name: Check Python syntax
        run: python -m py_compile source-simulator/simulator/generate_data.py
      - name: Initialize source schema
        run: |
          PGPASSWORD="$PGPASSWORD" psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f source-simulator/db/init/001_schema.sql
          PGPASSWORD="$PGPASSWORD" psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f source-simulator/db/init/002_tables.sql
      - name: Seed, insert and mutate
        run: |
          python source-simulator/simulator/generate_data.py seed --customers 30 --products 15 --orders 50 --seed 42
          python source-simulator/simulator/generate_data.py insert-orders --count 5 --seed 101
          python source-simulator/simulator/generate_data.py mutate --count 20 --seed 202
          orders=$(psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -Atc "SELECT COUNT(*) FROM source_incremental.orders")
          items=$(psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -Atc "SELECT COUNT(*) FROM source_incremental.order_items")
          test "$orders" = "55"
          test "$items" -gt "0"
      - name: Verify updated_at trigger
        run: |
          before=$(psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -Atc "SELECT updated_at FROM source_incremental.orders ORDER BY order_id LIMIT 1")
          sleep 1
          psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -c "UPDATE source_incremental.orders SET status = CASE WHEN status = 'NEW' THEN 'CONFIRMED' ELSE 'NEW' END WHERE order_id = 1"
          after=$(psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -Atc "SELECT updated_at FROM source_incremental.orders WHERE order_id = 1")
          test "$before" != "$after"
